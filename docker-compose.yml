# Keyless by default: the image's ENV selects the fake providers, so a fresh
# clone runs with no .env at all.
#
# REAL mode: put LLM_PROVIDER=openai, SEARCH_PROVIDER=web, FETCH_PROVIDER=http
# and the keys in a .env next to this file. The api service receives it via
# env_file below; .env is gitignored and dockerignored, so keys never reach git
# or the image. (Runtime env vars override the image ENV, which is what flips it.)
#
# ARA_BIND chooses the host interface the ports are published on. Default
# 0.0.0.0 = reachable from the network (fine for the keyless demo). For real mode
# set ARA_BIND=127.0.0.1 in .env so the app is reachable ONLY through an SSH
# tunnel — Docker-published ports bypass the host firewall (iptables/ufw), so
# binding to loopback is the reliable way to keep a paid app private.
#
# Both services restart on their own after a reboot or a stopped VM is started
# again; `docker compose stop` / `down` still stops them for good.
services:
  api:
    build: .
    image: agentic-research-assistant
    restart: unless-stopped
    env_file:
      - path: .env
        required: false          # a fresh clone has no .env -> keyless
    ports:
      - "${ARA_BIND:-0.0.0.0}:8000:8000"
    volumes:
      # Run history lives in a named volume, not in the container, so it survives
      # rebuilds, code updates and `docker compose down` (`down -v` deletes it).
      # ARA_RUNS_VOLUME=runs-review switches to a separate, empty history while a
      # reviewer has access, and back again (DEPLOYMENT.md §8 R4).
      - "${ARA_RUNS_VOLUME:-runs}:/app/runs"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    image: agentic-research-assistant
    restart: unless-stopped
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "${ARA_BIND:-0.0.0.0}:8501:8501"
    environment:
      API_URL: http://api:8000   # the UI stays a thin client; only the api holds keys
      # Optional login screen for sharing a real-mode instance (empty = no gate).
      # Compose reads it from the .env next to this file.
      ARA_UI_PASSWORD: ${ARA_UI_PASSWORD:-}
    depends_on:
      - api

volumes:
  runs:
  runs-review:
