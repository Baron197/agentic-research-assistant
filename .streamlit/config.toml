# Streamlit base theme for the Agentic Research Assistant UI.
# The app injects additional CSS for cards/timeline/chips; this sets the palette.
[theme]
primaryColor = "#2e6da4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2f6fb"
textColor = "#1f2933"
font = "sans serif"

[server]
headless = true

[client]
# Viewer toolbar for everyone: no "Deploy" button or developer menu entries in the
# deployed app (Streamlit shows them by default to anyone on localhost, which is
# how an SSH-tunnelled server is reached).
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
